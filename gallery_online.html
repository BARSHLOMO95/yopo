<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobe's Luxury Store - Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 30px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 8px;
            color: #888;
            font-size: 0.95rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
            background: #1a1a1a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 0.8rem;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .lightbox-close:hover { background: rgba(255,255,255,0.1); }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-prev { right: 20px; }
        .lightbox-next { left: 20px; }

        .lightbox-counter {
            margin-top: 16px;
            color: #888;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 12px;
            }
            header h1 { font-size: 1.4rem; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Kobe's Luxury Store</h1>
        <p>17 images</p>
    </header>

    <div class="gallery" id="gallery"></div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-next" onclick="navigate(-1)">&#8249;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigate(1)">&#8250;</button>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <script>
        const images = [
            "https://photo.yupoo.com/tianlong980120/3cfaf289/3e5dc51f.jpg",
            "https://photo.yupoo.com/tianlong980120/224e31a4/a6d43bf1.jpg",
            "https://photo.yupoo.com/tianlong980120/99a9997b/5597dd44.jpg",
            "https://photo.yupoo.com/tianlong980120/654982c4/f2b6c50a.jpg",
            "https://photo.yupoo.com/tianlong980120/ca61edf7/954ae5a2.jpg",
            "https://photo.yupoo.com/tianlong980120/1e49d8fa/66dea402.jpg",
            "https://photo.yupoo.com/tianlong980120/3351da0a/8edfb3a3.jpg",
            "https://photo.yupoo.com/tianlong980120/90e17616/7532b562.jpg",
            "https://photo.yupoo.com/tianlong980120/60acd159/59896d8b.jpg",
            "https://photo.yupoo.com/tianlong980120/b63c4519/12c451f3.jpg",
            "https://photo.yupoo.com/tianlong980120/8d73e42f/92a5e5d8.jpg",
            "https://photo.yupoo.com/tianlong980120/f360646e/9f33f277.jpg",
            "https://photo.yupoo.com/tianlong980120/a658974e/00f68f40.jpg",
            "https://photo.yupoo.com/tianlong980120/9a97acbb/bf1cc32f.jpg",
            "https://photo.yupoo.com/tianlong980120/d7449baa/3df11100.jpg",
            "https://photo.yupoo.com/tianlong980120/9a5056b1/c21c853c.jpg",
            "https://photo.yupoo.com/tianlong980120/cf9da308/7949dc2e.jpg"
        ];

        const gallery = document.getElementById('gallery');
        images.forEach((src, i) => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.onclick = () => openLightbox(i);
            div.innerHTML = `<img src="${src}" alt="Image ${i+1}" loading="lazy"><div class="overlay">${i+1} / ${images.length}</div>`;
            gallery.appendChild(div);
        });

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function navigate(dir) {
            currentIndex = (currentIndex + dir + images.length) % images.length;
            updateLightbox();
        }

        function updateLightbox() {
            document.getElementById('lightbox-img').src = images[currentIndex];
            document.getElementById('lightbox-counter').textContent = `${currentIndex + 1} / ${images.length}`;
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') navigate(-1);
            if (e.key === 'ArrowLeft') navigate(1);
        });

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLightbox();
        });

        let touchStartX = 0;
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) navigate(diff > 0 ? 1 : -1);
        });
    </script>
</body>
</html>
