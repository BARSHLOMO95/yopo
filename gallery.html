<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobe's Luxury Store - Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 30px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 8px;
            color: #888;
            font-size: 0.95rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
            background: #1a1a1a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 0.8rem;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,0.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .lightbox-nav:hover {
            background: rgba(255,255,255,0.2);
        }

        .lightbox-prev { right: 20px; }
        .lightbox-next { left: 20px; }

        .lightbox-counter {
            margin-top: 16px;
            color: #888;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 12px;
            }
            header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="lightbox" id="lightbox">

        <button class="lightbox-nav lightbox-next" onclick="navigate(-1)">&#8249;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigate(1)">&#8250;</button>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-counter" id="lightbox-counter"></div>

    <script>
        const images = [
            "downloaded_images/00e29c9a31a4e5ad2dd1c6172a7559fe.jpg",
            "downloaded_images/1f3cbbfd7d4fd50bff5666a9513d9524.jpg",

            "downloaded_images/2c12f23ea17ed15314bd12a5e1fa8fca.jpg",
            "downloaded_images/2d8013ba3b222cae5aaec01343510547.jpg",
            "downloaded_images/4d04bfa46907e17ff3365551bfdc2091.jpg",
            "downloaded_images/4d4769f21bea5007276ce03fefa031ca.jpg",
            "downloaded_images/5d1d1474d9037561482c02d9159e9a00.jpg",
            "downloaded_images/164ee03596b5bed95f5bb71d76ca86b4.jpg",
            "downloaded_images/a2ad5b7d54cfe0df1255e555c10ff598.jpg",
            "downloaded_images/bdeead20449b1f5cc68d97f30be7fe67.jpg",
            "downloaded_images/ca9c2a46b7eb6ceff43e4bd16b662d16.jpg",
            "downloaded_images/d4016b8461e936917bae1efddc8a6a7c.jpg",
            "downloaded_images/e88a724ab0eb64e9dfc9512849489d03.jpg",
            "downloaded_images/e2733aba46cbd49139aa272470f83d95.jpg",
            "downloaded_images/fa9e715c4923072e4d4f48d6fea6681d.jpg",
            "downloaded_images/29bd80e3d83580a054c30a079887ed97.jpg"
        ];

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function navigate(dir) {
            currentIndex = (currentIndex + dir + images.length) % images.length;
            updateLightbox();
        }

        function updateLightbox() {
            document.getElementById('lightbox-img').src = images[currentIndex];
            document.getElementById('lightbox-counter').textContent =
                `${currentIndex + 1} / ${images.length}`;
        }

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') navigate(-1);
            if (e.key === 'ArrowLeft') navigate(1);
        });

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLightbox();
        });
    </script>
